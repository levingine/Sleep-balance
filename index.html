<!DOCTYPE html>
<html>
<head>
    <title>koredify Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #000000;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            width: 90%;
            max-width: 380px;
            padding: 35px 25px;
            background: #111827;
            border: 1px solid #ff0000;
            border-radius: 18px;
            box-shadow: 0 0 25px #39ff8840;
            text-align: center;
            animation: appear 1s ease;
        }

        .ghost {
            font-size: 55px;
            animation: float 2s infinite alternate;
        }

        h1 {
            color: #ff0000;
            letter-spacing: 2px;
        }

        p {
            color: #aab3c5;
        }

        input {
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            background: #080b12;
            color: white;
            border: 1px solid #35445a;
            border-radius: 8px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            background: #FF0000;
            color: #FFFFFF;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #ff0000;
            color: white;
        }

        @keyframes float {
            from {
                transform: translateY(0);
            }
            to {
                transform: translateY(-12px);
            }
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(25px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
      .signup {
            color: blue;
}
    </style>
</head>

<body>

    <div class="login-box">

        <div class="ghost">
💻</div>

        <h1>KOREDIFY</h1>

        <p>Welcome back, online earner.</p>

        <form>
            <input type="text" placeholder="Enter Username">

            <input type="password" placeholder="Enter Password">

            <button type="button">LOGIN</button>
<div class="signup">
<h6> don't have an account yet? click here to sign up</h6>
</div>
        </form>

        <p>Secure Login Portal</p>

    </div>

</body>
</html>
